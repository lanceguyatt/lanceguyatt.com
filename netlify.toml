# Builds the site into dist/; the local storybook plugin then builds Storybook into
# dist/storybook/ in its onPostBuild hook, served at /storybook/
[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
STORYBOOK_DISABLE_TELEMETRY = "1"

[[plugins]]
package = "/netlify/plugins/storybook"

# Keep Storybook out of search results
[[headers]]
for = "/storybook/*"
[headers.values]
X-Robots-Tag = "noindex"
